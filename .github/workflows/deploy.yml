name: Refresh FEC data and deploy

on:
  schedule:
    - cron: "17 10 * * *"   # daily, 6:17 a.m. Eastern (EDT)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest FEC data
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}   # encrypted repo secret; masked in logs
        run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site                               # only the site/ folder is published
      - id: deploy
        uses: actions/deploy-pages@v4
